<aside
  class="sidebar"
  [style.width]="ui.sidebarWidth()">

  <div class="logo">
    CrackIT
  </div>

  <nav>

    @for (item of menuItems; track item.route) {

      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }">

        {{ item.icon }}
        {{ item.label }}

      </a>

    }

  </nav>

</aside>
