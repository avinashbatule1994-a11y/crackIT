@if (ui.isMobileMenuOpen()) {
<div class="sidebar-overlay" (click)="ui.closeMobileSidebar()"></div>
}

<aside class="sidebar" [class.mobile-open]="ui.isMobileMenuOpen()" [style.width]="ui.sidebarWidth()">

  <div class="logo">
    CrackIT
  </div>

  <nav>

    @for (item of menuItems; track item.route) {

    <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/' }">

      {{ item.icon }}
      {{ item.label }}

    </a>

    }

  </nav>

</aside>
