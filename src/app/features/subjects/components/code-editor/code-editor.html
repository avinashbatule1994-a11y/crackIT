<div class="editor-container">

  <div class="toolbar">

    <div class="left">

      <button class="primary" (click)="runCode()">
        ▶ Run
      </button>

      <button (click)="resetCode()">
        ↺ Reset
      </button>

      <button (click)="copyCode()">
        📋 Copy
      </button>

    </div>

  </div>

  <app-monaco-editor
      [code]="editorCode()"
      [language]="'javascript'"
      (codeChange)="editorCode.set($event)">
  </app-monaco-editor>

  <app-output-panel
      [output]="output()">
  </app-output-panel>

</div>
