
<p-card
  class="subject-card"
  [style.background]="subject().background"
  (click)="openSubject(subject())">

  <div>

    <div>
      <i  class="icon" [class]="subject().icon"
         [style.color]="subject().color">
      </i>
    </div>

    <h2>{{ subject().title }}</h2>

    <p class="description">
      {{ subject().description }}
    </p>

  </div>

  <div class="footer">

    <span>{{ subject().topics }} Topics</span>

    <i class="pi pi-arrow-right"></i>

  </div>

</p-card>
